# Blank issues stay enabled on purpose: SECURITY.md asks reporters to open a
# detail-free "Security contact request" issue while private vulnerability
# reporting is unavailable.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/nepthass/nepthass/blob/main/SECURITY.md
    about: Do not open a public issue with details. Read the security policy first.
