name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Vet integration tests (compile only, they need a live Home Assistant)
        run: go vet -tags=integration ./tests/integration/...
      - name: Build
        run: go build ./cmd/nepthass
      - name: Test
        run: go test -race -shuffle=on -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose files (no .env present)
        run: |
          docker compose config --quiet
          docker compose -f deploy/compose.with-homeassistant.yaml config --quiet
          docker compose --env-file .env.dev.example -f compose.dev.yaml --profile app --profile test config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nepthass:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
